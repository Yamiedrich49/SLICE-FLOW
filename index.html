<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f9f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SLICE FLOW — 指先で、立体を切る。</title>
<style>
:root{
 --ink:#173c43;--text:#294a4d;--mute:#8ba2a0;--mint:#078f87;--mint2:#37c6b2;
 --gold:#d69b63;--goldlite:#f7ebe1;--line:#dae9e5;--paper:#f7f9f8;
 --ease:cubic-bezier(.2,.85,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:var(--paper);color:var(--ink);overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid #2aaea2;outline-offset:3px}
button[disabled]{cursor:default;opacity:.30}
svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
button svg{pointer-events:none}
.app{width:min(100%,520px);min-height:100svh;min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 11px) 19px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;gap:10px}
.header{display:flex;align-items:center;justify-content:space-between;min-height:42px;flex:0 0 auto}
.wordmark{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;font-size:18px;letter-spacing:.135em;font-weight:850;white-space:nowrap;line-height:1}.wordmark span{color:var(--mint)}
.top-actions{display:flex;gap:4px}.round-btn{background:transparent;border:none;color:#6c8b8b;height:39px;width:39px;border-radius:14px;display:grid;place-items:center;transition:background .15s,color .15s,transform .15s}
.round-btn:active{background:#e8f2f0;transform:scale(.92)}
.stage-head{flex:0 0 auto;padding:3px 2px 0}
.eyebrow{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.15em;color:#7b9a98}
.eyebrow .num{letter-spacing:.09em;font-variant-numeric:tabular-nums;font-size:12px;color:#557e7c}
.track{margin-top:8px;width:100%;height:3px;border-radius:3px;background:#e3eae8;overflow:hidden}
.track i{display:block;width:1%;height:100%;background:linear-gradient(90deg,#7dd7c8,#07988d);border-radius:4px;transition:width .35s ease}
.prompt{margin:11px 0 0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:820;letter-spacing:.04em;line-height:1.3;text-align:center}
.prompt .tiny-star{width:7px;height:7px;border:1.5px solid #b3c8c2;transform:rotate(45deg);border-radius:2px;flex-shrink:0}
.subprompt{text-align:center;color:#92a7a5;font-size:11px;font-weight:580;letter-spacing:.025em;margin-top:5px;min-height:13px}
.arena{position:relative;flex:1 1 auto;min-height:270px;max-height:520px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:radial-gradient(ellipse 90% 75% at 48% 43%,#fff 0%,#fcfefd 45%,#f1f8f6 100%);border-radius:28px;border:1px solid #e1ebe8;box-shadow:0 19px 52px rgba(31,75,72,.075),inset 0 1px 0 #fff;overflow:hidden;isolation:isolate;transform:translateZ(0)}
.arena.grabbing{cursor:grabbing}
.arena:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(circle,#c6dcd7 0.65px,transparent .8px);background-size:25px 25px;mask-image:linear-gradient(to bottom,transparent 10%,#000 90%);-webkit-mask-image:linear-gradient(to bottom,transparent 10%,#000 90%)}
#scene{position:absolute;width:100%;height:100%;inset:0;display:block;touch-action:none}
.arena-tag{position:absolute;left:17px;top:17px;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:740;color:#688985;pointer-events:none;letter-spacing:.015em}
.arena-tag .tag-dot{width:7px;height:7px;border-radius:50%;border:2px solid #47bcae;background:#fff;box-shadow:0 0 0 3px #dff6ed}
.live-angles{position:absolute;right:18px;top:17px;display:flex;align-items:center;gap:5px;font-size:11px;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:700;letter-spacing:.025em;color:#588e8a;pointer-events:none;font-variant-numeric:tabular-nums}
.live-angles .angle-sep{color:#c7dcd6}
.action-guide{position:absolute;bottom:15px;left:0;right:0;pointer-events:none;text-align:center;color:#90aaa4;font-size:11px;font-weight:680;letter-spacing:.035em;transition:opacity .35s}
.action-guide.off{opacity:0}
.gesture-icon{display:inline-block;color:#4eaaa1;margin-right:7px;font-size:16px;vertical-align:-1px}
.magnet-pip{position:absolute;top:50%;left:50%;width:62px;height:62px;border-radius:50%;border:1.4px solid rgba(35,167,147,.28);transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none}
.magnet-pip.pop{animation:ping .34s ease-out}
@keyframes ping{0%{opacity:.75;transform:translate(-50%,-50%) scale(.7)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.pos-control{position:absolute;right:3px;top:58px;bottom:47px;width:55px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none;cursor:ns-resize}
.pos-rail{height:min(51%,178px);min-height:125px;position:relative;width:42px;display:flex;align-items:center;justify-content:center}
.pos-rail:before{content:"";position:absolute;top:12px;bottom:12px;width:2px;background:#d1e4de;border-radius:4px}
.pos-dot{position:absolute;left:50%;width:6px;height:6px;background:#b9d4cc;border-radius:50%;transform:translate(-50%,-50%)}.pos-dot.d0{top:12px}.pos-dot.d1{top:50%}.pos-dot.d2{top:calc(100% - 12px)}
.pos-grip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:30px;width:30px;background:#fff;border-radius:50%;border:2.5px solid #199b90;box-shadow:0 5px 13px #268a7c2a,0 1px 2px #267c7133;transition:box-shadow .18s}
.pos-control.dragging .pos-grip{box-shadow:0 0 0 7px #16b39b14,0 5px 15px #268a7c42}
.pos-title{font-size:9px;color:#81a4a0;font-weight:800;white-space:nowrap}
.feedback{position:relative;flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.specimen{display:flex;align-items:center;gap:5px;min-width:0;min-height:108px;border:1px solid #e4ebe8;background:#fff;border-radius:20px;padding:11px 8px 10px 14px;box-shadow:0 3px 12px #183b3b06}
.specimen.target{background:#fdfaf7;border-color:#f0e7dd}.specimen.current{border-color:#d7eae6;background:linear-gradient(122deg,#f6fcfa,#fff)}
.specimen-label{flex:0 0 45%;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.specimen-label small{font-size:10px;font-weight:900;letter-spacing:.115em;color:#bd906d;white-space:nowrap}.specimen.current small{color:#239d91}
.specimen-label strong{font-size:12px;line-height:1.4;font-weight:830;white-space:nowrap;color:#5f6964}.specimen.current strong{color:#2a8f83}
.specimen-label em{font-size:10px;font-weight:690;color:#9da8a3;font-style:normal;min-height:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.specimen canvas{min-width:0;flex:1;width:55%;height:82px;display:block}
.bottom-actions{min-height:48px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex:0 0 auto}
.soft-button{border:1px solid #dfeae6;background:#fff;border-radius:14px;color:#678681;padding:12px 15px;font-size:12px;font-weight:780;letter-spacing:.025em;white-space:nowrap;display:flex;align-items:center;gap:6px;min-height:45px;transition:transform .12s,background .12s}
.soft-button:active{transform:scale(.97);background:#f0f7f5}.soft-button svg{height:15px;width:15px}
.help-text{font-size:10px;line-height:1.4;color:#98a9a5;text-align:center;flex:1;min-width:0}
.next-button{border:0;border-radius:14px;background:var(--mint);box-shadow:0 7px 18px #0f968728;color:#fff;font-size:13px;font-weight:810;padding:13px 16px;min-height:45px;display:none;gap:6px;align-items:center;justify-content:center;white-space:nowrap;letter-spacing:.04em}
.next-button:active{transform:scale(.98)}
.bottom-note{text-align:center;color:#a9bab5;font-size:9px;letter-spacing:.03em;line-height:1.2;flex:0 0 auto}
.success-shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 48% 50%,#64d2bf30 0%,transparent 60%);opacity:0}
.success-shine.show{animation:shine .95s ease-out both}
@keyframes shine{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.success{position:absolute;left:50%;bottom:47px;transform:translate(-50%,18px) scale(.94);opacity:0;z-index:5;pointer-events:none;display:flex;align-items:center;gap:10px;border-radius:16px;background:rgba(255,255,255,.94);border:1px solid rgba(161,220,207,.8);padding:11px 17px 11px 13px;box-shadow:0 13px 38px #197e7124,0 2px 6px #137e6b12;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);transition:opacity .26s,transform .43s var(--ease);white-space:nowrap}
.success.show{opacity:1;transform:translate(-50%,0) scale(1)}
.success-mark{width:28px;height:28px;background:var(--mint);color:#fff;border-radius:50%;display:grid;place-items:center}.success-mark svg{width:16px;height:16px;stroke-width:2.5}
.success strong{font-size:16px;color:#167f75;font-weight:850;letter-spacing:.035em}.success small{font-size:10px;color:#93a6a0;font-weight:670}
.lesson-dots{display:flex;gap:5px;justify-content:center;margin-top:5px}.lesson-dots span{width:4px;height:4px;background:#dae9e3;border-radius:50%}.lesson-dots span.active{background:#35afa1;width:13px}
.sheet{position:fixed;inset:0;background:#173f4454;display:none;align-items:flex-end;justify-content:center;z-index:20;padding-top:40px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.sheet.open{display:flex}.sheet-inner{background:#fff;border-radius:27px 27px 0 0;padding:19px 20px calc(26px + env(safe-area-inset-bottom));width:min(100%,520px);max-height:min(83dvh,770px);display:flex;flex-direction:column;gap:12px;box-shadow:0 -18px 60px #112a2b29}
.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h2{font-size:18px;letter-spacing:.03em;margin:0}.sheet-sub{margin:0;font-size:11px;color:#92a6a2}
.level-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;overflow:auto;padding:4px 0 15px;overscroll-behavior:contain}
.level-grid button{aspect-ratio:1/1;border:1px solid #e4ede9;background:#f7f9f8;border-radius:10px;font-size:12px;font-weight:750;color:#698681}
.level-grid button.current-level{background:#dcf4ed;border-color:#8bcebd;color:#087d71}.level-grid button.done-level{background:#fff;border-color:#b6ded4;color:#18998a}
.level-grid button.locked{color:#c6d3cd;opacity:.6}
@media(max-width:390px){.app{padding-left:13px;padding-right:13px;gap:8px}.specimen{padding-left:10px;min-height:101px}.specimen-label{flex-basis:44%}.specimen-label strong{font-size:11px}.specimen canvas{height:76px}.arena{min-height:240px}.prompt{font-size:17px}.soft-button{padding:11px 12px}}
@media(max-height:770px){.app{gap:7px}.stage-head{padding-top:0}.prompt{margin-top:7px}.arena{min-height:210px}.feedback .specimen{min-height:92px;padding-top:6px;padding-bottom:6px}.specimen canvas{height:75px}.bottom-note{display:none}}
@media(max-height:640px){.arena{min-height:185px}.subprompt{margin-top:2px}.specimen{min-height:82px!important}.specimen canvas{height:65px!important}.bottom-actions{min-height:42px}.soft-button,.next-button{min-height:40px;padding-block:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
   <div class="wordmark" aria-label="SLICE FLOW">SLICE <span>FLOW</span></div>
   <nav class="top-actions" aria-label="ゲームメニュー">
    <button class="round-btn" id="prev" title="前の問題" aria-label="前の問題"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="round-btn" id="levels" title="ステージ一覧" aria-label="ステージ一覧"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg></button>
    <button class="round-btn" id="sound" title="音のオン・オフ" aria-label="音をオフにする"><svg id="soundIcon" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 5a10 10 0 0 1 0 14"/></svg></button>
   </nav>
  </header>
  <section class="stage-head" aria-label="ステージ情報">
   <div class="eyebrow"><span id="chapter">CHAPTER 01 · 傾ける</span><span class="num" id="stageCount">001 / 100</span></div>
   <div class="track"><i id="progressFill"></i></div>
   <h1 class="prompt"><i class="tiny-star"></i><span id="prompt">この断面をつくろう</span><i class="tiny-star"></i></h1>
   <div class="subprompt" id="subprompt">指でなぞって、切る面を動かす</div>
  </section>
  <div class="arena" id="viewport" aria-label="3D切断面。指を上下になぞると傾きが変わります。">
    <canvas id="scene"></canvas>
    <div class="arena-tag"><i class="tag-dot"></i><span id="solidName">四角すい</span></div>
    <div class="live-angles"><span id="tiltLabel">0°</span><span class="angle-sep" id="angleSep" hidden>·</span><span id="yawLabel" hidden>0°</span></div>
    <div class="action-guide" id="dragInstruction"><span class="gesture-icon">↕</span>上へなぞって、面を傾ける</div>
    <div class="magnet-pip" id="pip"></div>
    <div class="pos-control" id="posControl" aria-label="切る位置" role="slider" tabindex="0" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0">
      <div class="pos-rail" id="posRail"><i class="pos-dot d0"></i><i class="pos-dot d1"></i><i class="pos-dot d2"></i><i class="pos-grip" id="posKnob"></i></div><span class="pos-title">切る位置</span>
    </div>
    <div class="success-shine" id="shine"></div>
    <div class="success" id="success" aria-live="polite"><span class="success-mark"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span><div><strong>ぴったり！</strong><div><small id="winDetail">断面が重なった</small></div></div></div>
  </div>
  <div class="feedback" aria-label="断面の比較">
    <div class="specimen target"><div class="specimen-label"><small>GOAL</small><strong>めざす断面</strong><em id="goalEdges">目標</em></div><canvas id="goalCanvas" aria-label="目標の断面"></canvas></div>
    <div class="specimen current"><div class="specimen-label"><small>YOUR CUT</small><strong>いまの断面</strong><em id="nowEdges">いまの形</em></div><canvas id="nowCanvas" aria-label="現在の断面"></canvas></div>
  </div>
  <div class="bottom-actions">
    <button class="soft-button" id="hint"><svg viewBox="0 0 24 24"><path d="M9 18h6m-5-4h4m-4 7h4M8 15c-1.5-1.3-2.5-3-2.5-5A6.5 6.5 0 0 1 12 3.5 6.5 6.5 0 0 1 18.5 10c0 2-1 3.7-2.5 5L15 17H9l-1-2Z"/></svg>ヒント</button>
    <div class="help-text" id="status">指を離すと、角度がカチッと揃う</div>
    <button class="soft-button" id="reset" title="切断面を最初に戻す" aria-label="切断面を元に戻す"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button class="next-button" id="next">次の問題 <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <div class="bottom-note">音・ヒント・進み具合はいつでも調整できます</div>
</main>
<div class="sheet" id="levelSheet" aria-hidden="true" role="dialog" aria-label="ステージ一覧">
 <div class="sheet-inner"><div class="sheet-head"><h2>ステージを選ぶ</h2><button class="round-btn" id="closeLevels" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><p class="sheet-sub">クリアしたところまで、いつでも戻れます。</p><div class="level-grid" id="levelGrid"></div></div>
</div>
<script>

(()=>{'use strict';
const TOTAL=100, TAU=Math.PI*2, EPS=1e-7;
const $=id=>document.getElementById(id);
const xadd=(a,b)=>a.map((v,i)=>v+b[i]), xsub=(a,b)=>a.map((v,i)=>v-b[i]), dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0), cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], norm=a=>Math.hypot(...a), unit=a=>a.map(x=>x/(norm(a)||1));
const rndMaker=seed=>{let s=seed>>>0;return ()=>{s=(s+0x6d2b79f5)>>>0;let t=Math.imul(s^(s>>>15),1|s);t^=t+Math.imul(t^(t>>>7),61|t);return ((t^(t>>>14))>>>0)/4294967296}};
const round=(v,p=1000)=>Math.round(v*p)/p;
const shapeName=['四角すい','三角柱','四角柱','五角柱','斜めの柱','屋根型','八面体','六角柱'];
function polygon2d(n,r,phase,rr){let p=[];for(let i=0;i<n;i++){let a=phase+TAU*i/n,k=.90+rr()*.19;p.push([Math.cos(a)*r[0]*k,Math.sin(a)*r[1]*k]);}return p;}
function meshMake(kind,r){let vs=[],fs=[],poly,n;
 if(kind===0){ // square pyramid with an offset tip
  poly=[[-1.08,-.93],[1.03,-.93],[1.03,.94],[-1.08,.94]];n=4;
  poly.forEach(p=>vs.push([p[0],p[1],-.93]));vs.push([(r()-.5)*.64,(r()-.5)*.56,1.27]);
  fs.push([3,2,1,0]);for(let i=0;i<n;i++)fs.push([i,(i+1)%n,n]);
 }else if(kind===6){ // asymmetric double pyramid
  n=4;poly=polygon2d(n,[1.03,.88],Math.PI/4,r);poly.forEach(p=>vs.push([p[0],p[1],0]));
  vs.push([.17+(r()-.5)*.28,-.13,1.21]);vs.push([-.16,.11,-.99]);
  for(let i=0;i<n;i++){fs.push([i,(i+1)%n,n]);fs.push([(i+1)%n,i,n+1]);}
 }else{
  n=kind===1?3:kind===3?5:kind===7?6:4;
  if(n===4){let wx=.83+r()*.3,wy=.71+r()*.32;poly=[[-wx,-wy],[wx,-wy],[wx,wy],[-wx,wy]];}
  else poly=polygon2d(n,[1.02,.92],Math.PI/2+(r()-.5)*.35,r);
  let h=1.0+(r()-.5)*.2,shiftX=kind===4?.35+r()*.18:0,shiftY=kind===4?.19+r()*.2:0;
  let slopeX=kind===5?.32+r()*.15:0,slopeY=kind===5?.12:0;
  poly.forEach(([x,y])=>vs.push([x,y,-h]));
  poly.forEach(([x,y])=>vs.push([x+shiftX,y+shiftY,h+slopeX*x+slopeY*y]));
  fs.push([...Array(n)].map((_,i)=>n-1-i));fs.push([...Array(n)].map((_,i)=>n+i));
  for(let i=0;i<n;i++)fs.push([i,(i+1)%n,(i+1)%n+n,i+n]);
 }
 let min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];
 vs.forEach(v=>v.forEach((x,i)=>{min[i]=Math.min(min[i],x);max[i]=Math.max(max[i],x)}));
 let mid=min.map((v,i)=>(v+max[i])/2),sz=Math.max(...min.map((v,i)=>max[i]-v)),sca=2.48/sz;
 vs=vs.map(v=>v.map((x,i)=>(x-mid[i])*sca));
 let edges=[],set=new Set();fs.forEach(f=>{for(let i=0;i<f.length;i++){let a=f[i],b=f[(i+1)%f.length],key=[a,b].sort((x,y)=>x-y).join(',');if(!set.has(key)){set.add(key);edges.push([a,b]);}}});
 return{vs,fs,edges,kind,name:shapeName[kind]};
}
function normalFor(p){let t=p.t*Math.PI/180,y=p.y*Math.PI/180;return[Math.sin(t)*Math.cos(y),Math.sin(t)*Math.sin(y),Math.cos(t)];}
function planeFor(mesh,pose){let n=normalFor(pose),proj=mesh.vs.map(v=>dot(v,n));let extent=Math.max(...proj.map(Math.abs));return{n,d:pose.o*extent*.52};}
function section(mesh,pose){let {n,d}=planeFor(mesh,pose),points=[];
 for(const [i,j] of mesh.edges){let a=mesh.vs[i],b=mesh.vs[j],da=dot(a,n)-d,db=dot(b,n)-d;
  if(Math.abs(da)<EPS)points.push(a);
  if(Math.abs(db)<EPS)points.push(b);
  if(da*db< -EPS*EPS){let f=da/(da-db);points.push(a.map((x,k)=>x+(b[k]-x)*f));}
 }
 let unique=[];points.forEach(p=>{if(!unique.some(q=>norm(xsub(p,q))<1e-5))unique.push(p);});

 try{view.setPointerCapture(e.pointerId)}catch(_){}
 view.classList.add('grabbing');$('dragInstruction').classList.add('off');
});
view.addEventListener('pointermove',e=>{
 if(!drag||drag.id!==e.pointerId||solved)return;
 e.preventDefault();let dx=e.clientX-drag.x,dy=e.clientY-drag.y,cfg=stage.cfg;
 if(Math.hypot(dx,dy)>2)drag.moved=true;
 // Small soft attraction (not a dead-zone) around discrete click positions.
 const influence=(v,arr)=>{let n=nearest(v,arr),dif=v-n;return Math.abs(dif)<5?n+dif*.73:v;};
 let min=cfg.tilt[0],max=cfg.tilt[cfg.tilt.length-1];
 pose.t=influence(clamp(drag.start.t-dy*.57,min,max),cfg.tilt);
 if(cfg.yaw.length>1){
  if(Math.abs(dx)>6&&pose.t<7)pose.t=19; // horizontal motion cannot change a mathematically horizontal plane.
  pose.y=drag.start.y+dx*.72;
  pose.y=influence(pose.y,Array.from({length:26},(_,i)=>-360+i*45));
 }else pose.y=0;
 // The plane changes in real time and stays in view during gestures.
 let t=nearest(pose.t,cfg.tilt),y=nearest(mod(pose.y,360),cfg.yaw);
 if(t!==drag.lastT||(cfg.yaw.length>1&&y!==drag.lastY)){
  drag.lastT=t;drag.lastY=y;tickDetent();moveCount++;
 }
 requestPaint();
});
function releaseDrag(e){if(!drag||drag.id!==e.pointerId)return;
 if(!drag.moved){drag=null;view.classList.remove('grabbing');return;}
 drag=null;view.classList.remove('grabbing');snapAndCheck();
}
view.addEventListener('pointerup',releaseDrag);view.addEventListener('pointercancel',releaseDrag);
// Vertical height selector: continuous visual feedback, exactly three allowed planes.
const railY=y=>{let r=$('posRail').getBoundingClientRect();let f=clamp((y-r.top-12)/(r.height-24),0,1);return 1-2*f;};
$('posControl').addEventListener('pointerdown',e=>{
 if(solved)return;e.preventDefault();e.stopPropagation();UI.ensureAudio();snapMotion=null;offsetDrag={id:e.pointerId,last:nearest(pose.o,stage.cfg.offset)};
 try{$('posControl').setPointerCapture(e.pointerId)}catch(_){ }
 $('posControl').classList.add('dragging');pose.o=railY(e.clientY);requestPaint();
});
$('posControl').addEventListener('pointermove',e=>{
 if(!offsetDrag||e.pointerId!==offsetDrag.id)return;e.preventDefault();e.stopPropagation();pose.o=railY(e.clientY);
 let k=nearest(pose.o,stage.cfg.offset);if(k!==offsetDrag.last){offsetDrag.last=k;tickDetent();moveCount++;}requestPaint();
});
function releaseOffset(e){if(!offsetDrag||offsetDrag.id!==e.pointerId)return;offsetDrag=null;$('posControl').classList.remove('dragging');snapAndCheck();}
$('posControl').addEventListener('pointerup',releaseOffset);$('posControl').addEventListener('pointercancel',releaseOffset);
$('posControl').addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();stepChange('offset',e.key==='ArrowUp'?1:-1)}});
$('hint').addEventListener('click',()=>{if(solved)return;hintCount=Math.min(2,hintCount+1);$('status').textContent='金色の点を通るように切ってみよう';$('hint').disabled=hintCount>=2;requestPaint();});
$('reset').addEventListener('click',()=>{if(solved)return;snapMotion=null;tickDetent();animateTo({...stage.start},()=>{if(!solved)checkWin()},210);});
$('prev').addEventListener('click',()=>{if(index>0)initStage(index-1)});
$('next').addEventListener('click',()=>{if(!solved)return;if(index<TOTAL-1)initStage(index+1);else{$('next').style.display='none';$('status').style.display='block';$('status').textContent='全100問クリア！';}});
$('sound').addEventListener('click',()=>{UI.audioEnabled=!UI.audioEnabled;$('soundIcon').innerHTML=UI.audioEnabled?'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 5a10 10 0 0 1 0 14"/>':'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/>';$('sound').setAttribute('aria-label',UI.audioEnabled?'音をオフにする':'音をオンにする');save();if(UI.audioEnabled)UI.tick()});
if(!UI.audioEnabled)$('soundIcon').innerHTML='<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/>';
const sheet=$('levelSheet');
function showLevels(){let grid=$('levelGrid');grid.innerHTML='';for(let i=0;i<TOTAL;i++){
 let button=document.createElement('button');button.textContent=i+1;button.disabled=i>unlocked;button.className=i===index?'current-level':i<unlocked?'done-level':i>unlocked?'locked':'';
 button.setAttribute('aria-label',`ステージ ${i+1}`);button.addEventListener('click',()=>{hideLevels();initStage(i)});grid.appendChild(button);
 }sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');$('closeLevels').focus();
}
function hideLevels(){sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');$('levels').focus()}
$('levels').addEventListener('click',showLevels);$('closeLevels').addEventListener('click',hideLevels);
sheet.addEventListener('click',e=>{if(e.target===sheet)hideLevels()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('open')){hideLevels();return;}
 if(sheet.classList.contains('open')||e.target.matches('button, [role="slider"]'))return;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();stepChange(e.key==='ArrowUp'||e.key==='ArrowDown'?'tilt':'yaw',e.key==='ArrowUp'||e.key==='ArrowRight'?1:-1)}
 if(e.key==='PageUp'||e.key==='PageDown'){e.preventDefault();stepChange('offset',e.key==='PageUp'?1:-1)}
});
window.addEventListener('resize',()=>{drawSection(goalCanvas,stage.goalSection,true);requestPaint()});
window.addEventListener('orientationchange',()=>setTimeout(()=>{drawSection(goalCanvas,stage.goalSection,true);requestPaint()},120));
window.__sliceDebug={stages,section,canonical,setStage:(n)=>initStage(n-1),setPose:(p)=>{snapMotion=null;pose={...p};requestPaint();checkWin()},state:()=>({index:index+1,pose,solved,solutionCount:stage.solutionCount}),summaries:()=>stages.map((s,i)=>({level:i+1,kind:s.mesh.name,options:s.entries.length,goal:s.goal,initial:s.start}))};
initStage(index);
})();
