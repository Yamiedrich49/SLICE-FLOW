function planeBasis(n){let aux=Math.abs(n[1])>.9?[1,0,0]:[0,1,0],u=norm(cross(n,aux)),v=norm(cross(n,u));return{u,v}}

scene.addEventListener('pointerdown',e=>{if(won)return;e.preventDefault();audioInit();sliding=true;pid=e.pointerId;lastY=e.clientY;startT=t;scene.setPointerCapture(pid);showHint=false;$('instruction').classList.add('hidden')});scene.addEventListener('pointermove',onMove);function stop(e){if(e.pointerId!==pid||!sliding)return;sliding=false;pid=null;let d=difference(makeCut(levelObj.p,levelObj.n,t));if(d<.058){let min=Infinity,best=t,steps=360;for(let j=0;j<=steps;j++){let k=lo+(hi-lo)*j/steps,dd=difference(makeCut(levelObj.p,levelObj.n,k));if(dd<min&&Math.abs(k-t)<(hi-lo)*.085){min=dd;best=k}}if(min<.036){t=best;requestDraw();checkWin()}}else requestDraw()}
scene.addEventListener('pointerup',stop);scene.addEventListener('pointercancel',stop);
window.addEventListener('keydown',e=>{if(won)return;if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();audioInit();t=clamp(t+(e.key==='ArrowUp'?1:-1)*(hi-lo)*.027,lo,hi);sound(660,.012,.035);requestDraw();if(difference(makeCut(levelObj.p,levelObj.n,t))<.025)checkWin()}});
$('next').onclick=()=>{li=(li+1)%levels.length;storage.setItem('acorn_slice_level',li);configure();sound(620,.021,.06)};$('reset').onclick=()=>{audioInit();configure();sound(630,.018,.05)};$('sound').onclick=()=>{soundOn=!soundOn;storage.setItem('acorn_slice_sound',soundOn?'on':'off');updateSound();if(soundOn)sound(740,.027,.065)};function updateSound(){$('soundsvg').innerHTML=soundOn?'<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/>':'<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9 5 6m0-6-5 6"/>'}
window.addEventListener('resize',requestDraw);if('ResizeObserver'in window)new ResizeObserver(requestDraw).observe(hero);updateSound();configure();
})();
