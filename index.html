function showLevel(i){stage=(i+levels.length)%levels.length;const l=levels[stage];game={a:l.start.a,b:l.start.b,d:l.start.d,preview:false,correct:false,tries:0,selection:null,hint:0,openedAt:0,failShown:false};drag=null;pointers.clear();cam={yaw:.68,pitch:.42};animated=null;lastStamp=-1;
$('num').textContent=String(stage+1).padStart(3,'0')+' / '+String(levels.length).padStart(3,'0');$('progress').style.width=((stage+1)/levels.length*100)+'%';$('chapter').textContent='CHAPTER '+String(l.chapter).padStart(2,'0')+' · '+(['','想像する','切り出す','空間を読む'][l.chapter]);$('mode').textContent=l.kind==='predict'?'01 — PREDICT':'02 — CREATE';$('title').textContent=l.kind==='predict'?'切ったら、何角形？':titles[l.target]+'を切り出そう';$('subtitle').textContent=l.kind==='predict'?'断面はまだ見えない。切る前に想像しよう。':'面を動かして想像しよう。答えは切った後。';$('solid').textContent=shapes[l.solid].en+' · '+shapes[l.solid].name;$('status').textContent='SECTION HIDDEN';$('scenefoot').textContent=l.kind==='predict'?'↔ 指で立体を回して、断面を想像しよう':l.allowOffset?'↔ 面を回す　·　下で切る位置を変える':'↔ 指で切断面を回そう';$('result').classList.remove('visible');$('controltitle').textContent=l.kind==='predict'?'断面の辺の数を予想':'切断面を動かして形をつくる';$('choices').innerHTML=l.kind==='predict'?[3,4,5,6].map(n=>`<button class="choice" data-edges="${n}" aria-label="${titles[n]}">${iconPoly(n)}<span>${titles[n]}</span></button>`).join(''):'';$('choices').style.display=l.kind==='predict'?'grid':'none';$('offsetrow').style.display=l.allowOffset?'flex':'none';$('offset').value=Math.round(game.d/.115);$('offsetout').textContent=game.d.toFixed(1);$('hint').textContent=l.kind==='predict'?'正解を確かめるのは、切った後。':'切るまでは、断面の形は見えない。';$('hint').className='hint';$('cut').className='cut';$('cut').disabled=l.kind==='predict';$('cutlabel').textContent=l.kind==='predict'?'選んでから CUT':'スパッと切る';$('stamps').innerHTML='';for(let k=0;k<3;k++)$('stamps').innerHTML+='<i></i>';
Array.from(document.querySelectorAll('.choice')).forEach(btn=>btn.addEventListener('click',()=>{if(game.preview)return;game.selection=Number(btn.dataset.edges);document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===btn));$('cut').disabled=false;tick();}));requestDraw();}
function cut(){if(!game)return;const l=levels[stage];if(game.preview){if(game.correct){if(completed<stage+1){completed=stage+1;safeSet('sf_done',completed);}if(stage+1<levels.length)showLevel(stage+1);else showModal('<h2>MASTER CUTTER</h2><p>40問をクリア。立体と平面の関係が、最初より少し見えるようになったかな？</p><button id="mrestart">最初から遊ぶ</button>');}else{game.preview=false;game.failShown=false;$('result').classList.remove('visible');$('status').textContent='SECTION HIDDEN';$('scenefoot').textContent=l.kind==='predict'?'↔ 指で立体を回して、断面を想像しよう':l.allowOffset?'↔ 面を回す　·　下で切る位置を変える':'↔ 指で切断面を回そう';$('cut').className='cut';$('cutlabel').textContent='もう一度、切る';$('hint').textContent='今の断面を手がかりに、もう一度。';$('hint').className='hint';requestDraw();}return;}
if(l.kind==='predict'&&!game.selection)return;const n=normal(game.a,game.b),s=shapes[l.solid],shape=slice(s,n,game.d);const ok=l.kind==='predict'?game.selection===shape.count:shape.count===l.target;
game.preview=true;game.correct=ok;game.tries++;game.openedAt=performance.now();game.lastSlice=shape;game.lastNormal=n;game.lastD=game.d;game.failShown=!ok;
$('status').textContent=ok?'PERFECT CUT':'CUT RESULT';$('resultname').textContent=titles[shape.count]||'交差なし';drawSectionIcon(shape.pts,n);$('scenefoot').textContent='切断面が現れた。形と辺を確かめよう';$('result').classList.add('visible');$('cut').className='cut '+(ok?'success':'retry');$('cutlabel').textContent=ok?'次の問題へ':'もう一度考える';$('hint').textContent=ok?'その切り方！ 頭の中の形と一致したね。':`今の断面は${titles[shape.count]||'交差なし'}。どう変えればよい？`;$('hint').className='hint '+(ok?'good':'warn');const stamps=$('stamps').children;if(stamps[Math.min(game.tries-1,2)])stamps[Math.min(game.tries-1,2)].className=ok?'on':'failed';slashSound();if(ok){setTimeout(winSound,170);if(completed<stage+1){completed=stage+1;safeSet('sf_done',completed);}}else setTimeout(failSound,180);requestDraw();}
$('cut').addEventListener('click',cut);$('offset').addEventListener('input',e=>{if(game?.preview)return;game.d=+e.target.value*.115;$('offsetout').textContent=game.d.toFixed(1);requestDraw()});$('offset').addEventListener('change',tick);
$('sound').addEventListener('click',()=>{soundOn=!soundOn;safeSet('sf_sound',soundOn?'1':'0');updateSound();if(soundOn)tick()});function updateSound(){$('sound').style.opacity=soundOn?'1':'.38';$('sound').title=soundOn?'サウンド ON':'サウンド OFF'}
$('help').addEventListener('click',()=>{if(!game)return;game.hint++;const l=levels[stage];$('hint').className='hint';if(l.kind==='predict')$('hint').textContent=game.hint%3===1?'平面が横切る立体の「辺」の本数を想像しよう。':game.hint%3===2?'交差した辺を線でつなぐと断面の輪郭になる。':'立体を回し、奥側の辺も確認してみよう。';else $('hint').textContent=game.hint%3===1?'辺を多く横切るほど、断面の角が増える。':game.hint%3===2?'頂点の近くを切ると小さな三角形が生まれやすい。':'面の傾きだけでなく、通過する高さも大切。';tick();});
function showModal(html){$('modal').innerHTML=html;$('modalwrap').style.display='grid';const btn=$('modal').querySelector('#mrestart');if(btn)btn.onclick=()=>{$('modalwrap').style.display='none';showLevel(0)};}
$('levels').addEventListener('click',()=>{const max=Math.min(levels.length,Math.max(completed+1,1));showModal(`<div class="tiny">STAGE SELECT</div><h2>どこから切る？</h2><p>クリアしたステージに戻れます。</p><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px;text-align:center">${Array.from({length:max},(_,i)=>`<button data-stage="${i}" style="margin:0;padding:10px 0;border-radius:10px;background:${i===stage?'#168f86':'#edf5f2'};color:${i===stage?'white':'#416d69'}">${i+1}</button>`).join('')}</div><button id="mclose" style="background:#edf5f2;color:#668c87">戻る</button>`);$('modal').querySelectorAll('[data-stage]').forEach(el=>el.addEventListener('click',()=>{$('modalwrap').style.display='none';showLevel(+el.dataset.stage)}));$('mclose').onclick=()=>$('modalwrap').style.display='none';});$('modalwrap').addEventListener('click',e=>{if(e.target===$('modalwrap'))$('modalwrap').style.display='none'});
function pointerDown(e){if(game.preview)return;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY,a:game.a,b:game.b,cy:cam.yaw,cp:cam.pitch,stamp:0};audioContext();}
function pointerMove(e){if(!pointers.has(e.pointerId)||!drag||game.preview)return;const l=levels[stage];let dx=e.clientX-drag.x,dy=e.clientY-drag.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(l.kind==='predict'||pointers.size>1){cam.yaw=drag.cy+dx*.009;cam.pitch=Math.max(-.05,Math.min(1.15,drag.cp+dy*.007));}else{const old=Math.round(game.a/15)+'|'+Math.round(game.b/15);game.a=Math.max(-78,Math.min(78,drag.a+dx*.32));game.b=Math.max(-78,Math.min(78,drag.b-dy*.32));const mark=Math.round(game.a/15)+'|'+Math.round(game.b/15);if(mark!==old&&performance.now()-(drag.stamp||0)>64){drag.stamp=performance.now();tone(600,.036,.009)}}requestDraw();}
function pointerUp(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(!game.preview&&levels[stage].kind==='make'&&pointers.size===0&&drag){const sa=Math.round(game.a/15)*15,sb=Math.round(game.b/15)*15;animated={fromA:game.a,fromB:game.b,toA:Math.max(-75,Math.min(75,sa)),toB:Math.max(-75,Math.min(75,sb)),at:performance.now(),ms:185};tick();}drag=null;requestDraw();}
canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2.5);width=Math.max(1,r.width);height=Math.max(1,r.height);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);requestDraw();}let dirty=true;function requestDraw(){dirty=true;}
function project(p){let cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),ce=Math.cos(cam.pitch),se=Math.sin(cam.pitch);let xx=p[0]*cy-p[1]*sy,yy=p[0]*sy+p[1]*cy;const scale=Math.min(width*.295,height*.237,151);return [width/2+xx*scale,height*.485+(-p[2]*ce+yy*se)*scale,yy*ce+p[2]*se];}
function path3(poly){if(!poly.length)return;const a=project(poly[0]);ctx.beginPath();ctx.moveTo(a[0],a[1]);for(let i=1;i<poly.length;i++){const p=project(poly[i]);ctx.lineTo(p[0],p[1]);}ctx.closePath();}
function strokePoly(poly,color='#7daba6',lw=1.7){if(poly.length<2)return;path3(poly);ctx.lineWidth=lw;ctx.strokeStyle=color;ctx.lineJoin='round';ctx.stroke();}
function clipFace(pts,n,d,sign){let out=[];for(let i=0;i<pts.length;i++){let a=pts[i],b=pts[(i+1)%pts.length],fa=(dot(n,a)-d)*sign,fb=(dot(n,b)-d)*sign,ia=fa>=-1e-7,ib=fb>=-1e-7;if(ia&&ib)out.push(b);else if(ia&&!ib)out.push(add(a,mul(sub(b,a),fa/(fa-fb))));else if(!ia&&ib){out.push(add(a,mul(sub(b,a),fa/(fa-fb))));out.push(b);}}return out;}
function drawFaces(shape,part,n,d,sep){const mv=n?mul(n,part*sep):[0,0,0];const polys=[];for(const f of shape.f){let p=f.map(i=>shape.v[i]);if(n)p=clipFace(p,n,d,part);if(p.length<3)continue;p=p.map(v=>add(v,mv));const depth=p.reduce((s,v)=>s+project(v)[2],0)/p.length;polys.push({p,depth});}polys.sort((a,b)=>a.depth-b.depth);for(const [i,obj] of polys.entries()){path3(obj.p);let light=.055+i*.012;ctx.fillStyle=`rgba(103,194,181,${light})`;ctx.fill();ctx.strokeStyle='rgba(116,160,158,.67)';ctx.lineWidth=1.4;ctx.stroke();}}
function planePoly(n,d,s=1.78){const [u,v]=basis(n),c=mul(n,d),poly=[];for(let i=0;i<48;i++){const th=i*TAU/48;poly.push(add(c,add(mul(u,Math.cos(th)*s),mul(v,Math.sin(th)*s))));}return poly;}
function drawPlane(n,d,fade=1){const q=planePoly(n,d,1.68);ctx.save();ctx.globalAlpha=fade;path3(q);ctx.fillStyle='rgba(54,192,171,.125)';ctx.fill();ctx.lineWidth=1.3;ctx.strokeStyle='rgba(57,173,162,.75)';ctx.stroke();const base=mul(n,d),[u,v]=basis(n);for(let i=-1;i<=1;i++){const p=add(base,mul(u,i*.68)),q1=add(base,mul(v,i*.68));const x1=add(p,mul(v,-1.8)),x2=add(p,mul(v,1.8)),y1=add(q1,mul(u,-1.8)),y2=add(q1,mul(u,1.8));ctx.beginPath();let s1=project(x1),s2=project(x2);ctx.moveTo(s1[0],s1[1]);ctx.lineTo(s2[0],s2[1]);ctx.strokeStyle='rgba(52,179,159,.11)';ctx.lineWidth=.7;ctx.stroke();}ctx.restore()}
function drawSectionIcon(pts,n){const cn=$('section2d'),c=cn.getContext('2d');if(!c)return;c.clearRect(0,0,cn.width,cn.height);if(pts.length<3)return;const [u,v]=basis(n),vs=pts.map(p=>[dot(p,u),dot(p,v)]),cx=vs.reduce((x,p)=>x+p[0],0)/vs.length,cy=vs.reduce((x,p)=>x+p[1],0)/vs.length,xs=vs.map(p=>p[0]-cx),ys=vs.map(p=>p[1]-cy),r=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys),.1),sc=102/r;c.save();c.translate(cn.width/2,cn.height/2);c.scale(sc,-sc);c.beginPath();c.moveTo(xs[0],ys[0]);for(let i=1;i<vs.length;i++)c.lineTo(xs[i],ys[i]);c.closePath();c.fillStyle='#b6eae1';c.strokeStyle='#0c9589';c.lineWidth=2.6/sc;c.lineJoin='round';c.fill();c.stroke();for(let i=0;i<vs.length;i++){c.beginPath();c.arc(xs[i],ys[i],2.8/sc,0,TAU);c.fillStyle='#0d9c90';c.fill();}c.restore();}
function drawCap(pts,n,sep,side,primary){if(pts.length<3)return;let poly=pts.map(p=>add(p,mul(n,sep*side)));path3(poly);ctx.save();ctx.shadowBlur=primary?17:7;ctx.shadowColor='rgba(32,186,170,.22)';ctx.fillStyle=primary?'rgba(63,203,181,.63)':'rgba(28,173,158,.25)';ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=primary?'#078e85':'rgba(16,146,133,.55)';ctx.lineWidth=primary?3:1.6;ctx.lineJoin='round';ctx.stroke();for(const v of poly){let p=project(v);ctx.beginPath();ctx.arc(p[0],p[1],primary?3.2:2.4,0,TAU);ctx.fillStyle='#f6fffc';ctx.fill();ctx.strokeStyle='#14a697';ctx.lineWidth=1.2;ctx.stroke();}ctx.restore();}
function drawAmbient(){ctx.save();const g=ctx.createRadialGradient(width/2,height*.76,1,width/2,height*.76,width*.4);g.addColorStop(0,'rgba(43,112,100,.095)');g.addColorStop(1,'rgba(43,112,100,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(width/2,height*.76,width*.37,height*.065,0,0,TAU);ctx.fill();ctx.restore()}
let loopTime=0;function draw(t){requestAnimationFrame(draw);if(!width||!height||!game)return;if(animated){const q=Math.min(1,(t-animated.at)/animated.ms),ease=1-Math.pow(1-q,3);game.a=animated.fromA+(animated.toA-animated.fromA)*ease;game.b=animated.fromB+(animated.toB-animated.fromB)*ease;if(q>=1)animated=null;dirty=true;}if(game.preview&&t-game.openedAt<720)dirty=true;if(!dirty)return;dirty=false;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);const l=levels[stage],s=shapes[l.solid],n=normal(game.a,game.b);drawAmbient();if(!game.preview){drawPlane(n,game.d);drawFaces(s,0);ctx.save();const c=project(mul(n,game.d));ctx.beginPath();ctx.arc(c[0],c[1],3,0,TAU);ctx.fillStyle='#0ba394';ctx.fill();ctx.restore();}else{let q=Math.min(1,(t-game.openedAt)/620),ease=1-Math.pow(1-q,3),sep=.4*ease;let cutN=game.lastNormal,cutD=game.lastD;drawPlane(cutN,cutD,.20*(1-ease));drawFaces(s,-1,cutN,cutD,sep);drawFaces(s,1,cutN,cutD,sep);drawCap(game.lastSlice.pts,cutN,sep,-1,false);drawCap(game.lastSlice.pts,cutN,sep,1,true);}}
function start(){updateSound();showLevel(Math.min(completed,levels.length-1));resize();new ResizeObserver(resize).observe(canvas);requestAnimationFrame(draw);}start();
window.__SLICE_FLOW={shapes,levels,normal,slice,showLevel,get game(){return game},get stage(){return stage},cut};
})();
